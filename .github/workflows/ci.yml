name: Codex Hair Bar Build

on:
  push:
    branches: [main, codex-hair-bar]
  pull_request:
  workflow_dispatch:

concurrency:
  group: codex-hair-bar-${{ github.ref }}
  cancel-in-progress: true

jobs:
  build:
    runs-on: macos-15

    steps:
      - uses: actions/checkout@v4

      - name: Toolchain
        run: |
          swift --version
          xcodebuild -version
          echo "macOS SDK: $(xcrun --sdk macosx --show-sdk-version)"

      - name: Build
        run: |
          set -o pipefail
          swift build -Xswiftc -swift-version -Xswiftc 6 2>&1 | tee build.log

      - name: No warnings
        run: |
          if grep -q "warning:" build.log; then
            echo "::error::The build produced warnings."
            grep "warning:" build.log | head -40
            exit 1
          fi

      - name: Tests
        run: swift test -Xswiftc -swift-version -Xswiftc 6

      - name: Assemble app
        run: ./Scripts/bundle.sh

      - name: Check bundle
        run: |
          APP="build.noindex/Codex Hair Bar.app"
          test -x "$APP/Contents/MacOS/CodexHairBar"
          test "$(defaults read "$PWD/$APP/Contents/Info.plist" LSUIElement)" = "1"
          test "$(defaults read "$PWD/$APP/Contents/Info.plist" LSMinimumSystemVersion)" = "14.0"
          echo "Version: $(defaults read "$PWD/$APP/Contents/Info.plist" CFBundleShortVersionString)"
          echo "Architectures: $(lipo -archs "$APP/Contents/MacOS/CodexHairBar")"
